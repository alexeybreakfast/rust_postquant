[package]
name = "server"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.20"
tungstenite = "0.20"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
scopeguard = "1.2"
base64 = "0.22"
rand_core = { version = "0.6", features = ["getrandom"] }
ml-kem = "0.2"
hybrid-array = "0.4.15"
